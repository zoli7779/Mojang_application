	<div id="main-menu">
		<!-- Singleplayer game mode button -->
		<button onclick="startSingleplayer()">Egyjátékos mód</button>
		<!-- Opens the multiplayer submenu -->
		<button onclick="openMultiplayerMenu()">Többjátékos mód</button>
	</div>

	<!-- Multiplayer submenu (hidden by default) -->
	<div id="multiplayer-menu" style="display: none;">
		<h2>Többjátékos Játék</h2>
    
		<!-- Creates the world/game session -->
		<button onclick="hostGame()">Világ Létrehozása (Host)</button>
    
		<br><br>
    
		<!-- Input field for entering the connection code or IP address -->
		<input type="text" id="room-code-input" placeholder="Írd be a csatlakozási kódot / IP-t...">
		<!-- Button to connect to the hosted game -->
		<button onclick="joinGame()">Csatlakozás</button>
    
		<!-- Returns to the main menu -->
		<button onclick="backToMainMenu()">Vissza</button>
	</div>

<script>

		// Function called when the Host button is clicked in the menu
	function onHostGameClick() {
		const message = hostGame();
		alert(message + " Please go to the LAN sharing page to generate your code.");
	}

	// Function called when the Share to LAN button is clicked on the other page
	function onShareToLanClick() {
		const code = shareToLan();
		alert(`Game shared on LAN! Your connection code is: ${code}`);
	}

	// Function called when the Join button is clicked
	function onJoinGameClick() {
		const enteredCode = document.getElementById('room-code-input').value;
		
		// Call the server logic function
		const result = joinGame(enteredCode);
    
		// Show the result message to the user
		alert(result.message);

		if (result.success) {
			// Here you can call your function that loads the game interface for the guest
			// loadGameScreen();
		}
	}

</script>
